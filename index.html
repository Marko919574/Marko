<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Radsatz-Lager</title>
<style>
/* Layout: Kopfzeile mit Bestand, ein Arbeitsbereich je Tab, feste Tab-Leiste unten, Kamera als Vollbild-Ebene. Regalnummern sehen aus wie gelbe Regalschilder. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#17202B; --muted:#5C6877; --line:#D3D8DF;
  --accent:#0B5C8E; --accent-ink:#FFFFFF; --tag:#FFD23F; --tag-ink:#1B1600; --ok:#1E7A4B; --warn:#B3261E;
  --display:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'Roboto Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12181F; --surface:#1B242E; --ink:#E8ECF1; --muted:#9AA6B4; --line:#2D3947; --accent:#5AB0E6; --accent-ink:#06121C; --ok:#5BD08F; --warn:#FF8A80; color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px));
  max-width:720px; margin-inline:auto}
h1{font-family:var(--display); font-weight:700; font-size:34px; line-height:1; margin:0; letter-spacing:.01em}
header{display:flex; flex-direction:column; gap:4px; margin-bottom:16px}
#stat{margin:0; color:var(--muted); font-size:15px}
#backup{margin:0; font-size:13px; color:var(--muted)} #backup.warn{color:var(--warn)}
#msg{min-height:24px; margin:0 0 12px; font-weight:600}
#msg.ok{color:var(--ok)} #msg.warn{color:var(--warn)}
label,.lab{display:block; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.row{display:flex; gap:8px; align-items:stretch} .row>*{min-width:0}
input[type=text],textarea{width:100%; font-family:var(--mono); font-weight:600; font-size:18px; color:var(--ink); background:var(--surface);
  border:2px solid var(--line); border-radius:6px; padding:12px; min-height:52px}
textarea{font-size:14px; min-height:110px; resize:vertical}
input[type=text]:focus,textarea:focus{outline:none; border-color:var(--accent)}
button{font:inherit; font-weight:600; min-height:52px; padding:0 16px; border-radius:6px; border:2px solid var(--accent); background:var(--accent);
  color:var(--accent-ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px}
button.ghost{background:transparent; color:var(--accent)}
button.danger{border-color:var(--warn); color:var(--warn); background:transparent}
button.danger.sure{background:var(--warn); color:var(--surface)}
button.small{min-height:40px; padding:0 12px; font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button svg{width:20px; height:20px; flex:none}
section{margin-bottom:20px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px}
.tag{display:inline-block; background:var(--tag); color:var(--tag-ink); font-family:var(--mono); font-weight:700; border:2px solid var(--tag-ink);
  border-radius:4px; padding:2px 10px; letter-spacing:.02em; overflow-wrap:anywhere}
.tag.big{font-size:44px; line-height:1.15; padding:6px 18px; margin:4px 0 12px}
.code{font-family:var(--mono); font-weight:700; overflow-wrap:anywhere}
.muted{color:var(--muted); font-size:14px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.hint{color:var(--muted); margin:16px 0}
ul.plain{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
ul.plain li{display:flex; gap:12px; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px}
ul.plain li>div{min-width:0}
li.pick{cursor:pointer}
details{background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:10px}
summary{list-style:none; cursor:pointer; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:12px}
summary::-webkit-details-marker{display:none}
details .inner{padding:0 12px 12px}
.count{font-family:var(--display); font-size:20px; font-weight:700; color:var(--muted)}
.tabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs button{background:transparent; color:var(--muted); border-color:transparent; min-height:48px; font-family:var(--display); font-size:17px; padding:0 4px}
.tabs button[aria-current=true]{background:var(--accent); color:var(--accent-ink)}
/* Kamera */
#scan{position:fixed; inset:0; z-index:50; background:#000; display:flex; flex-direction:column}
#scan[hidden]{display:none}
#scan video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#scan .frame{position:absolute; left:50%; top:42%; width:min(80vw,520px); height:min(34vw,200px); min-height:120px; transform:translate(-50%,-50%);
  border:3px solid var(--tag); border-radius:10px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#scan .bar{position:relative; margin-top:auto; padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(0,0,0,.72); color:#fff; display:flex; flex-direction:column; gap:12px}
#scanMsg{margin:0; min-height:24px; font-weight:600; text-align:center}
#scan .bar button{background:#fff; color:#111; border-color:#fff}
</style>
</head>
<body>
<header>
  <h1>Radsatz-Lager</h1>
  <p id="stat">Lade …</p>
  <p id="backup"></p>
</header>
<p id="msg" role="status" aria-live="polite"></p>
<main id="main"></main>
<nav class="tabs" aria-label="Bereiche">
  <button type="button" data-act="tab" data-tab="search">Suchen</button>
  <button type="button" data-act="tab" data-tab="in">Einlagern</button>
  <button type="button" data-act="tab" data-tab="move">Umlagern</button>
  <button type="button" data-act="tab" data-tab="list">Lager</button>
</nav>
<div id="scan" hidden>
  <video id="vid" playsinline muted></video>
  <div class="frame"></div>
  <div class="bar"><p id="scanMsg">Barcode in den Rahmen halten</p><button type="button" data-act="closeScan">Schließen</button></div>
</div>
<input type="file" id="csvfile" accept=".csv,.txt,text/csv,text/plain" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = c => String(c).trim().toUpperCase();
const idOf = c => key(c);
const natural = (a, b) => String(a).localeCompare(String(b), 'de', {numeric: true});
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

let items = new Map(), tab = 'search', activeRegal = '', recent = [], moved = [], moveId = '', listFilter = '', confirmId = '';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- Daten (nur auf diesem Gerät) ---------- */
function load() {
  try { items = new Map(JSON.parse(ls.get('rl_items', '[]')).map(v => [idOf(v.radsatz), v])); } catch (e) { items = new Map(); }
  activeRegal = ls.get('rl_regal', '');
}
function save() {
  if (!ls.set('rl_items', JSON.stringify([...items.values()]))) msg('Speichern nicht möglich. Der Gerätespeicher ist voll oder gesperrt.', 'warn');
}
function put(it) { items.set(idOf(it.radsatz), it); save(); }
function del(id) { items.delete(id); save(); }
function regals() { const s = new Set(); items.forEach(v => s.add(key(v.regal))); return s; }

/* ---------- Anzeige-Helfer ---------- */
function msg(t, cls) { const m = $('#msg'); m.textContent = t || ''; m.className = cls || ''; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString('de-DE') : ''; }
function drawHeader() {
  $('#stat').textContent = `${items.size} Radsätze in ${regals().size} Regalen`;
  const lb = Number(ls.get('rl_backup', '0')), b = $('#backup');
  if (!items.size) { b.textContent = 'Die Daten liegen nur auf diesem Gerät.'; b.className = ''; }
  else if (!lb) { b.textContent = 'Noch keine Sicherung gemacht. Im Reiter „Lager“ als CSV speichern.'; b.className = 'warn'; }
  else {
    const days = Math.floor((Date.now() - lb) / 864e5);
    b.textContent = `Letzte Sicherung: ${fmtDate(lb)}${days > 7 ? ` (vor ${days} Tagen)` : ''}`;
    b.className = days > 7 ? 'warn' : '';
  }
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-current', String(x.dataset.tab === tab)));
}

/* ---------- Kamera: Barcode direkt im Live-Bild ---------- */
const Scanner = {
  active: false, stream: null, timer: 0, cb: null, continuous: false, last: '', lastT: 0, detector: null, zx: null, canvas: null,
  async open(cb, continuous) {
    if (this.active) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Die Kamera geht nur, wenn die App über https geöffnet wird.', 'warn'); return; }
    this.cb = cb; this.continuous = !!continuous; this.last = ''; this.lastT = 0;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false});
    } catch (e) {
      msg(e && e.name === 'NotAllowedError' ? 'Kamera-Zugriff ist blockiert. Erlaube die Kamera in den Browser-Einstellungen für diese Seite.' : 'Die Kamera ließ sich nicht starten.', 'warn');
      return;
    }
    const v = $('#vid'); v.srcObject = this.stream;
    try { await v.play(); } catch (e) {}
    $('#scanMsg').textContent = 'Barcode in den Rahmen halten';
    $('#scan').hidden = false; this.active = true;
    if ('BarcodeDetector' in window) { try { this.detector = new BarcodeDetector(); } catch (e) { this.detector = null; } }
    if (!this.detector) await this.loadZx();
    this.loop();
  },
  async loadZx() {
    if (window.ZXing) { this.initZx(); return; }
    await new Promise(res => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
      s.onload = res; s.onerror = res; document.head.appendChild(s);
    });
    if (window.ZXing) this.initZx();
    else { $('#scanMsg').textContent = 'Dieser Browser kann Barcodes nicht lesen. Nutze Chrome oder Samsung Internet, oder tippe die Nummer ein.'; }
  },
  initZx() {
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    this.zx = new ZXing.MultiFormatReader(); this.zx.setHints(hints);
    this.canvas = document.createElement('canvas');
  },
  async read() {
    const v = $('#vid'); if (v.readyState < 2 || !v.videoWidth) return null;
    if (this.detector) {
      try { const r = await this.detector.detect(v); return r.length ? r[0].rawValue : null; } catch (e) { return null; }
    }
    if (this.zx) {
      const c = this.canvas, w = Math.min(v.videoWidth, 1280), h = Math.round(w * v.videoHeight / v.videoWidth);
      c.width = w; c.height = h; c.getContext('2d', {willReadFrequently: true}).drawImage(v, 0, 0, w, h);
      try { return this.zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); } catch (e) { return null; }
    }
    return null;
  },
  loop() {
    if (!this.active) return;
    this.read().then(async code => {
      if (code && this.active) {
        code = code.trim(); const now = Date.now();
        if (code && !(code === this.last && now - this.lastT < 3000)) {
          this.last = code; this.lastT = now;
          if (navigator.vibrate) navigator.vibrate(80);
          if (!this.continuous) { const cb = this.cb; this.close(); cb(code); return; }
          const text = await this.cb(code);
          if (text && this.active) $('#scanMsg').textContent = text;
        }
      }
      if (this.active) this.timer = setTimeout(() => this.loop(), 120);
    });
  },
  close() {
    this.active = false; clearTimeout(this.timer);
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null; $('#vid').srcObject = null; $('#scan').hidden = true;
  }
};
const scan = (cb, continuous) => Scanner.open(cb, continuous);

/* ---------- Tab: Suchen ---------- */
function buildSearch() {
  $('#main').innerHTML = `
    <section>
      <label for="q">Radsatz-Nummer</label>
      <div class="row">
        <input type="text" id="q" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="scannen oder eintippen">
        <button type="button" data-act="scanQ" aria-label="Barcode mit der Kamera scannen">${CAM}Kamera</button>
      </div>
    </section>
    <div id="res"></div>`;
  const q = $('#q');
  q.addEventListener('input', drawSearch);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); drawSearch(); q.select(); } });
}
function drawSearch() {
  const q = $('#q'); if (!q) return;
  const v = q.value.trim(), res = $('#res');
  if (!v) {
    res.innerHTML = items.size
      ? '<p class="hint">Scanne den Barcode eines Radsatzes. Du siehst sofort, in welchem Regal er liegt.</p>'
      : '<p class="hint">Im Lager ist noch nichts eingetragen. Wechsle zu „Einlagern“ und scanne das erste Regal.</p>';
    return;
  }
  const hit = items.get(idOf(v));
  if (hit) {
    const sure = confirmId === idOf(v);
    res.innerHTML = `<div class="card">
      <div class="lab">Liegt in Regal</div>
      <span class="tag big">${esc(hit.regal)}</span>
      <div class="code">${esc(hit.radsatz)}</div>
      <div class="muted">eingelagert am ${fmtDate(hit.ts)}</div>
      <div class="actions">
        <button type="button" class="ghost" data-act="openRegal" data-regal="${esc(hit.regal)}">Alles in diesem Regal</button>
        <button type="button" class="ghost" data-act="moveFromSearch" data-id="${esc(idOf(v))}">Umlagern</button>
        <button type="button" class="danger ${sure ? 'sure' : ''}" data-act="del" data-id="${esc(idOf(v))}">${sure ? 'Wirklich entnehmen?' : 'Entnehmen'}</button>
      </div></div>`;
    return;
  }
  const u = key(v);
  const m = [...items.values()].filter(x => key(x.radsatz).includes(u)).sort((a, b) => natural(a.radsatz, b.radsatz)).slice(0, 20);
  if (!m.length) { res.innerHTML = `<div class="card"><div class="lab">Nicht gefunden</div><div class="code">${esc(v)}</div><p class="muted">Dieser Radsatz ist nicht im Lager eingetragen.</p></div>`; return; }
  res.innerHTML = `<div class="lab">Ähnliche Nummern</div><ul class="plain">${m.map(x =>
    `<li class="pick" data-act="pick" data-code="${esc(x.radsatz)}"><div class="code">${esc(x.radsatz)}</div><span class="tag">${esc(x.regal)}</span></li>`).join('')}</ul>`;
}

/* ---------- Tab: Einlagern ---------- */
function buildIn() {
  $('#main').innerHTML = `<section id="regalBox"></section><section id="itemBox"></section><div id="recent"></div>`;
  drawIn();
}
function drawIn() {
  const rb = $('#regalBox'), ib = $('#itemBox'); if (!rb) return;
  if (!activeRegal) {
    rb.innerHTML = `<label for="rin">1. Regal scannen</label>
      <div class="row"><input type="text" id="rin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Regal-Barcode">
      <button type="button" data-act="scanRegal" aria-label="Regal-Barcode mit der Kamera scannen">${CAM}Kamera</button></div>
      <div class="actions"><button type="button" class="ghost" data-act="setRegal">Regal setzen</button></div>`;
    ib.innerHTML = '<p class="hint">Danach scannst du die Radsätze, die in diesem Regal liegen. Die Kamera bleibt dabei offen, du scannst einen Radsatz nach dem anderen.</p>';
    $('#rin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setRegal($('#rin').value); } });
  } else {
    rb.innerHTML = `<div class="lab">Aktuelles Regal</div>
      <div class="row" style="align-items:center;justify-content:space-between"><span class="tag big" style="margin:0">${esc(activeRegal)}</span>
      <button type="button" class="ghost" data-act="clearRegal">Regal wechseln</button></div>`;
    ib.innerHTML = `<label for="sin">2. Radsätze scannen</label>
      <div class="row"><input type="text" id="sin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Radsatz-Barcode">
      <button type="button" data-act="scanItems" aria-label="Radsätze nacheinander mit der Kamera scannen">${CAM}Kamera</button></div>
      <div class="actions"><button type="button" class="ghost" data-act="addItem">Einlagern</button></div>`;
    $('#sin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem($('#sin').value); } });
  }
  drawRecent();
}
function setRegal(v) {
  v = String(v || '').trim(); if (!v) return;
  if (items.has(idOf(v))) { msg(`„${v}“ ist als Radsatz eingetragen. Scanne hier den Barcode des Regals.`, 'warn'); return 'Das ist ein Radsatz, kein Regal.'; }
  activeRegal = v; ls.set('rl_regal', v);
  msg(''); drawIn(); drawHeader();
  if (!Scanner.active) { const s = $('#sin'); if (s) s.focus(); }
}
function clearRegal() { activeRegal = ''; ls.del('rl_regal'); msg(''); drawIn(); const r = $('#rin'); if (r) r.focus(); }
function addItem(v) {
  v = String(v || '').trim(); const input = $('#sin');
  if (!v || !activeRegal) return '';
  let text, cls = 'ok';
  if (regals().has(key(v))) { text = `„${v}“ ist ein Regal. Tippe auf „Regal wechseln“.`; cls = 'warn'; }
  else {
    const old = items.get(idOf(v));
    put({radsatz: v, regal: activeRegal, ts: Date.now()});
    if (old && key(old.regal) === key(activeRegal)) text = `${v} war schon in Regal ${activeRegal}.`;
    else if (old) text = `${v} verschoben: von ${old.regal} nach ${activeRegal}.`;
    else text = `${v} liegt jetzt in Regal ${activeRegal}.`;
    recent.unshift({radsatz: v, regal: activeRegal}); recent = recent.slice(0, 8);
    drawRecent(); drawHeader();
  }
  msg(text, cls);
  if (input) { input.value = ''; if (!Scanner.active) input.focus(); }
  return text;
}
function drawRecent() {
  const r = $('#recent'); if (!r) return;
  r.innerHTML = recent.length ? `<div class="lab">Zuletzt eingelagert</div><ul class="plain">${recent.map(x =>
    `<li><div class="code">${esc(x.radsatz)}</div><span class="tag">${esc(x.regal)}</span></li>`).join('')}</ul>` : '';
}

/* ---------- Tab: Umlagern ---------- */
function buildMove() {
  $('#main').innerHTML = `<section id="mvItem"></section><section id="mvRegal"></section><div id="mvDone"></div>`;
  drawMove();
}
function drawMove() {
  const a = $('#mvItem'), b = $('#mvRegal'); if (!a) return;
  const it = moveId ? items.get(moveId) : null;
  if (!it) {
    moveId = '';
    a.innerHTML = `<label for="min">1. Radsatz scannen</label>
      <div class="row"><input type="text" id="min" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Radsatz-Barcode">
      <button type="button" data-act="scanMoveItem" aria-label="Radsatz-Barcode mit der Kamera scannen">${CAM}Kamera</button></div>
      <div class="actions"><button type="button" class="ghost" data-act="pickMove">Weiter</button></div>`;
    b.innerHTML = '<p class="hint">Danach scannst du das neue Regal. Der Radsatz wird dorthin verschoben.</p>';
    $('#min').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pickMove($('#min').value); } });
  } else {
    a.innerHTML = `<div class="card"><div class="lab">Radsatz</div><div class="code" style="font-size:22px">${esc(it.radsatz)}</div>
      <div class="lab" style="margin-top:12px">Liegt jetzt in Regal</div><span class="tag">${esc(it.regal)}</span>
      <div class="actions"><button type="button" class="ghost small" data-act="resetMove">Anderer Radsatz</button></div></div>`;
    b.innerHTML = `<label for="mrg">2. Neues Regal scannen</label>
      <div class="row"><input type="text" id="mrg" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Barcode des neuen Regals">
      <button type="button" data-act="scanMoveRegal" aria-label="Regal-Barcode mit der Kamera scannen">${CAM}Kamera</button></div>
      <div class="actions"><button type="button" class="ghost" data-act="doMove">Umlagern</button></div>`;
    $('#mrg').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doMove($('#mrg').value); } });
  }
  const d = $('#mvDone');
  d.innerHTML = moved.length ? `<div class="lab">Zuletzt umgelagert</div><ul class="plain">${moved.map(x =>
    `<li><div class="code">${esc(x.radsatz)}</div><span><span class="tag">${esc(x.from)}</span> → <span class="tag">${esc(x.to)}</span></span></li>`).join('')}</ul>` : '';
}
function pickMove(v) {
  v = String(v || '').trim(); if (!v) return;
  if (!items.has(idOf(v))) { msg(`„${v}“ ist nicht im Lager eingetragen. Neue Radsätze legst du unter „Einlagern“ an.`, 'warn'); return; }
  moveId = idOf(v); msg(''); drawMove(); const r = $('#mrg'); if (r) r.focus();
}
function resetMove() { moveId = ''; msg(''); drawMove(); const i = $('#min'); if (i) i.focus(); }
function doMove(v) {
  v = String(v || '').trim(); const it = items.get(moveId);
  if (!v || !it) return;
  if (items.has(idOf(v))) { msg(`„${v}“ ist ein Radsatz. Scanne den Barcode des Regals.`, 'warn'); return; }
  if (key(v) === key(it.regal)) { msg(`${it.radsatz} liegt schon in Regal ${it.regal}.`, 'warn'); return; }
  put({radsatz: it.radsatz, regal: v, ts: Date.now()});
  moved.unshift({radsatz: it.radsatz, from: it.regal, to: v}); moved = moved.slice(0, 8);
  msg(`${it.radsatz} ist umgelagert: von ${it.regal} nach ${v}.`, 'ok');
  moveId = ''; drawMove(); drawHeader(); const i = $('#min'); if (i) i.focus();
}

/* ---------- Tab: Lager ---------- */
function buildList() {
  $('#main').innerHTML = `
    <section>
      <label for="f">Filter nach Regal oder Radsatz</label>
      <div class="row"><input type="text" id="f" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="z. B. Regal scannen" value="${esc(listFilter)}">
      <button type="button" data-act="scanF" aria-label="Barcode mit der Kamera scannen">${CAM}Kamera</button></div>
    </section>
    <div id="listBody"></div>
    <section class="card" style="margin-top:20px">
      <div class="lab">Sicherung und Excel</div>
      <div class="actions" style="margin-top:0">
        <button type="button" data-act="export">Als CSV sichern</button>
        <button type="button" class="ghost" data-act="chooseFile">CSV laden</button>
      </div>
      <details style="margin-top:12px"><summary>Liste aus Excel einfügen</summary><div class="inner">
        <p class="muted">Zwei Spalten kopieren (Regal, Radsatz) und hier einfügen. Pro Zeile ein Radsatz. Vorhandene Radsätze werden ins angegebene Regal verschoben.</p>
        <textarea id="imp" aria-label="Regal und Radsatz" spellcheck="false" placeholder="R-01&#9;RS-1001&#10;R-01&#9;RS-1002"></textarea>
        <div class="actions"><button type="button" data-act="import">Importieren</button></div>
      </div></details>
    </section>`;
  $('#f').addEventListener('input', e => { listFilter = e.target.value.trim(); drawList(); });
}
function drawList() {
  const body = $('#listBody'); if (!body) return;
  const v = key(listFilter), groups = new Map();
  items.forEach((it, id) => {
    if (v && !key(it.regal).includes(v) && !key(it.radsatz).includes(v)) return;
    const k = key(it.regal);
    if (!groups.has(k)) groups.set(k, {name: it.regal, list: []});
    groups.get(k).list.push({id, ...it});
  });
  if (!groups.size) { body.innerHTML = `<p class="hint">${items.size ? 'Dazu gibt es keinen Eintrag.' : 'Noch keine Radsätze eingelagert.'}</p>`; return; }
  const sorted = [...groups.values()].sort((a, b) => natural(a.name, b.name));
  const open = v || sorted.length <= 2;
  body.innerHTML = sorted.map(g => `<details ${open ? 'open' : ''}><summary><span class="tag">${esc(g.name)}</span><span class="count">${g.list.length} Radsätze</span></summary><div class="inner"><ul class="plain" style="margin-top:0">${
    g.list.sort((a, b) => natural(a.radsatz, b.radsatz)).map(x => {
      const sure = confirmId === x.id;
      return `<li><div><div class="code">${esc(x.radsatz)}</div><div class="muted">${fmtDate(x.ts)}</div></div>
      <button type="button" class="danger small ${sure ? 'sure' : ''}" data-act="del" data-id="${esc(x.id)}">${sure ? 'Sicher?' : 'Entnehmen'}</button></li>`;
    }).join('')}</ul></div></details>`).join('');
}
function doExport() {
  const rows = [...items.values()].sort((a, b) => natural(a.regal, b.regal) || natural(a.radsatz, b.radsatz));
  if (!rows.length) { msg('Es gibt noch nichts zu sichern.', 'warn'); return; }
  const csv = '﻿' + ['Regal;Radsatz;Datum', ...rows.map(r => `${r.regal};${r.radsatz};${fmtDate(r.ts)}`)].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `lager-raeder-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  ls.set('rl_backup', String(Date.now())); drawHeader(); msg('Sicherung gespeichert. Du findest die Datei im Download-Ordner.', 'ok');
}
function importText(t) {
  const lines = String(t || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let n = 0, bad = 0;
  for (const l of lines) {
    const p = l.split(/[;\t,]/).map(x => x.trim());
    if (/^regal$/i.test(p[0])) continue;
    if (p.length < 2 || !p[0] || !p[1]) { bad++; continue; }
    const old = items.get(idOf(p[1]));
    items.set(idOf(p[1]), {radsatz: p[1], regal: p[0], ts: old && key(old.regal) === key(p[0]) ? old.ts : Date.now()}); n++;
  }
  save(); drawHeader(); if (tab === 'list') drawList();
  msg(`${n} Radsätze importiert${bad ? `, ${bad} Zeilen übersprungen` : ''}.`, bad ? 'warn' : 'ok');
}

/* ---------- Steuerung ---------- */
function setTab(t) {
  Scanner.close(); tab = t; confirmId = ''; msg('');
  if (t === 'search') buildSearch(); else if (t === 'in') buildIn(); else if (t === 'move') buildMove(); else buildList();
  update();
}
function update() {
  drawHeader();
  if (tab === 'search') drawSearch(); else if (tab === 'list') drawList();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') setTab(el.dataset.tab);
  else if (act === 'closeScan') Scanner.close();
  else if (act === 'scanQ') scan(c => { $('#q').value = c; drawSearch(); });
  else if (act === 'scanRegal') scan(c => setRegal(c));
  else if (act === 'scanItems') scan(c => addItem(c), true);
  else if (act === 'scanMoveItem') scan(c => pickMove(c));
  else if (act === 'scanMoveRegal') scan(c => doMove(c));
  else if (act === 'scanF') scan(c => { $('#f').value = c; listFilter = c; drawList(); });
  else if (act === 'setRegal') setRegal($('#rin').value);
  else if (act === 'clearRegal') clearRegal();
  else if (act === 'addItem') addItem($('#sin').value);
  else if (act === 'pickMove') pickMove($('#min').value);
  else if (act === 'doMove') doMove($('#mrg').value);
  else if (act === 'resetMove') resetMove();
  else if (act === 'pick') { $('#q').value = el.dataset.code; drawSearch(); }
  else if (act === 'openRegal') { listFilter = el.dataset.regal; setTab('list'); }
  else if (act === 'moveFromSearch') { const id = el.dataset.id; setTab('move'); moveId = id; drawMove(); const r = $('#mrg'); if (r) r.focus(); }
  else if (act === 'export') doExport();
  else if (act === 'chooseFile') $('#csvfile').click();
  else if (act === 'import') { importText($('#imp').value); $('#imp').value = ''; }
  else if (act === 'del') {
    const id = el.dataset.id;
    if (confirmId === id) { confirmId = ''; del(id); msg('Radsatz entnommen.', 'ok'); drawHeader(); if (tab === 'search') { drawSearch(); } else drawList(); }
    else { confirmId = id; update(); setTimeout(() => { if (confirmId === id) { confirmId = ''; update(); } }, 4000); }
  }
});
$('#csvfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(String(r.result).replace(/^﻿/, '')); r.readAsText(f, 'utf-8'); e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (document.hidden) Scanner.close(); });

load();
setTab(activeRegal ? 'in' : 'search');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
